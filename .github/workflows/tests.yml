name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: iOS ${{ matrix.ios }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ios: "17"
            runner: macos-14
            xcode: "16.2"
          - ios: latest
            runner: macos-latest
            xcode: default

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        if: matrix.xcode != 'default'
        env:
          XCODE_VERSION: ${{ matrix.xcode }}
        run: |
          sudo xcode-select -switch "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Select simulator
        id: simulator
        env:
          IOS_TARGET: ${{ matrix.ios }}
        run: |
          ruby <<'RUBY'
          require "json"
          require "open3"
          require "rubygems"

          target = ENV.fetch("IOS_TARGET")
          json, stderr, status = Open3.capture3("xcrun", "simctl", "list", "devices", "available", "-j")
          abort(stderr) unless status.success?

          devices_by_runtime = JSON.parse(json).fetch("devices")

          runtimes = devices_by_runtime.keys
            .select { |runtime| runtime.start_with?("com.apple.CoreSimulator.SimRuntime.iOS-") }
            .map do |runtime|
              version = runtime.split("iOS-", 2).last.tr("-", ".")
              [runtime, version, Gem::Version.new(version)]
            end

          selected = if target == "latest"
            runtimes.max_by { |_, _, version| version }
          else
            runtimes
              .select { |_, _, version| version.segments.first == target.to_i }
              .max_by { |_, _, version| version }
          end

          abort("No available iOS #{target} simulator runtime found") unless selected

          runtime, version = selected
          devices = devices_by_runtime.fetch(runtime)
          device = devices.find { |candidate| candidate["name"].start_with?("iPhone") } || devices.first
          abort("No available simulator device found for iOS #{version}") unless device

          File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |output|
            output.puts("ios_version=#{version}")
            output.puts("device_name=#{device.fetch("name")}")
            output.puts("device_id=#{device.fetch("udid")}")
          end
          RUBY

      - name: Show selected simulator
        run: |
          echo "iOS ${{ steps.simulator.outputs.ios_version }}"
          echo "${{ steps.simulator.outputs.device_name }} (${{ steps.simulator.outputs.device_id }})"

      - name: Run tests
        run: |
          xcodebuild \
            -scheme Lucent \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}' \
            -derivedDataPath "$RUNNER_TEMP/LucentDerivedData" \
            test \
            CODE_SIGNING_ALLOWED=NO
