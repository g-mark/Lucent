name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: iOS ${{ matrix.ios }}
    runs-on: macos-15 # as of 2026-05-17, same as macos-latest; macos-26 only has ios-26 simulators.
    strategy:
      fail-fast: false
      matrix:
        # See https://github.com/actions/runner-images for images.
        # Check what is labelled "macos-latest", and in each image what the "default" Xcode is.
        # Latest & default are behind the bleeding edge.
        # Lucent requires Swift 6.2, which means Xcode 26.
        include:
          - ios: "18.5"
            xcode: "26.3"
            device: "iPhone 16 Pro"
          - ios: "26.2"
            xcode: "26.3"
            device: "iPhone 17 Pro"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        if: matrix.xcode != 'default'
        env:
          XCODE_VERSION: ${{ matrix.xcode }}
        run: |
          sudo xcode-select -switch "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Create simulator
        id: simulator
        env:
          DEVICE_NAME: ${{ matrix.device }}
          IOS_VERSION: ${{ matrix.ios }}
        run: |
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-${IOS_VERSION//./-}"
          simulator_name="Lucent CI ${DEVICE_NAME} iOS ${IOS_VERSION}"

          xcrun simctl list runtimes available
          udid="$(xcrun simctl create "$simulator_name" "$DEVICE_NAME" "$runtime")"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      - name: Run tests
        run: |
          xcodebuild \
            -scheme Lucent \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath "$RUNNER_TEMP/LucentDerivedData" \
            test \
            CODE_SIGNING_ALLOWED=NO
